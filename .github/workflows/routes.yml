# The routes library: every pull request is linted, and index.json is rebuilt on main (PLAN-LAUNCH §4.3).
# The linter is vendored in tools/ by the app repo's scripts/sync-route-tools.sh, so this repo needs only Python.
name: Routes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  lint-and-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint
        run: python3 tools/route_format.py lint routes/*/route.md
      - name: Rebuild the index
        if: github.event_name == 'push'
        run: |
          python3 tools/route_format.py index routes --verified verified.json --out index.json \
            --repo "https://github.com/${{ github.repository }}"
          if ! git diff --quiet index.json; then
            git config user.name "sidekick-routes-bot"
            git config user.email "routes@learnwithsidekick.com"
            git commit -qam "index.json"
            git push
          fi
